# Long-session soak (PLAN H1): apps/web/e2e/soak.spec.ts. 100 edits on the demo bracket, then ten
# close/reopen cycles; asserts kernel shape handles return to baseline, JS/Wasm/process memory stay
# bounded and regen time does not drift. Nightly and on demand; never on push or pull request.
# A separate workflow (not a job in ci.yml) so the nightly run does not repeat the whole CI suite.
# The `stress` job runs the 100+ feature enclosure (packages/test-fixtures/stress-part): kernel
# goldens and the Node regen benchmark, then the report-only browser benchmark. It never gates.
# The `browsers` jobs run the whole E2E suite on Firefox and WebKit (moved here from ci.yml,
# ADR-083), also non-gating, so they no longer compete with the gating chromium shards for runners.
name: Soak

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

env:
  WREN_BASE: /${{ github.event.repository.name }}/

jobs:
  kernel:
    name: Kernel
    uses: ./.github/workflows/kernel.yml

  build:
    name: Build (web)
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - name: Download drawing kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drawing-kernel-dist
          path: packages/kernel/drawing/dist
      - run: pnpm build
      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  # Firefox and WebKit: reported, never gating (ADR-005 section 7): headless Firefox has no GL on
  # CI runners, and Playwright WebKit cannot reload offline with a service worker. Same project
  # names and sharding as they had in ci.yml. Pass/fail per shard and the failing tests go to the
  # job summary; reports are uploaded for every shard.
  browsers:
    name: ${{ matrix.browser }} (shard ${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install ${{ matrix.browser }}
        run: scripts/ci-install-browsers.sh @wren-cad/web ${{ matrix.browser }}
      - name: Run Playwright
        # Firefox runs headed under Xvfb: headless Firefox on GPU-less runners has no GL context at
        # all, while Xvfb + Mesa (llvmpipe) gives it a working software WebGL2 (ADR-005 section 7).
        # WebKit also runs the installed-PWA chrome checks on the iPad Pro 11 device (webkit-ipad).
        shell: bash
        run: |
          set -o pipefail
          case "${{ matrix.browser }}" in
            firefox)
              WREN_HEADED=1 xvfb-run -a pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=firefox --shard=${{ matrix.shard }}/3 2>&1 | tee apps/web/browser.log ;;
            webkit)
              pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=webkit --project=webkit-ipad --shard=${{ matrix.shard }}/3 2>&1 | tee apps/web/browser.log ;;
          esac
      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.browser }} shard ${{ matrix.shard }}/3"
            echo '```'
            grep -hE '^\s+[0-9]+ (passed|failed|flaky|skipped|did not run)|^\s+(✘|[0-9]+\) )' apps/web/browser.log 2>/dev/null | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/browser.log
          if-no-files-found: ignore
          retention-days: 14

  soak:
    name: Soak (chromium)
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - name: Download drawing kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drawing-kernel-dist
          path: packages/kernel/drawing/dist
      - name: Build
        run: pnpm build
      - name: Install chromium
        run: scripts/ci-install-browsers.sh @wren-cad/web chromium
      - name: Soak
        env:
          WREN_SOAK: "1"
        shell: bash
        run: pnpm --filter @wren-cad/web exec playwright test --trace off --project=soak 2>&1 | tee apps/web/soak.log
      - name: Record soak numbers
        if: always()
        run: |
          {
            echo "## Soak"
            grep -h '\[soak\]' apps/web/soak.log 2>/dev/null || echo "(see the job log)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Stress part: report-only numbers for a realistic 100+ feature part (how long does an edit to an
  # early feature take, does the UI stay responsive). Never gates a build (continue-on-error); the
  # tables go to the job summary. Local equivalent: `pnpm stress` (see packages/test-fixtures/README.md).
  stress:
    name: Stress part (chromium)
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - name: Download drawing kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drawing-kernel-dist
          path: packages/kernel/drawing/dist
      - name: Kernel goldens and regen benchmark (Node, single-threaded kernel)
        env:
          WREN_STRESS: "1"
        shell: bash
        run: pnpm --filter @wren-cad/test-fixtures exec vitest run stress-part --testTimeout=3600000 2>&1 | tee stress-node.log
      - name: HLR timing (Node, drawing kernel; report only)
        env:
          WREN_STRESS: "1"
        shell: bash
        run: pnpm --filter @wren-cad/test-fixtures exec vitest run hlr-timing --testTimeout=3600000 2>&1 | tee hlr-timing.log
      - name: Build
        run: pnpm build
      - name: Install chromium
        run: scripts/ci-install-browsers.sh @wren-cad/web chromium
      - name: Browser benchmark (WebGL software fallback on the runner)
        shell: bash
        run: pnpm --filter @wren-cad/web exec playwright test --trace off --project=stress 2>&1 | tee apps/web/stress-browser.log
      - name: Record stress numbers
        if: always()
        run: |
          {
            echo "## Stress part"
            echo '```'
            grep -h '\[stress\]' stress-node.log apps/web/stress-browser.log 2>/dev/null || echo "(see the job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            stress-node.log
          if-no-files-found: ignore
          retention-days: 14
