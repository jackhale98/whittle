name: CI

on:
  pull_request:
  push:
    # `claude/**` is the dev branch family: a push gets the same fast-feedback pipeline as main, but
    # never deploys (the `pages` and `cloudflare` jobs are main-only). ADR-083.
    branches: [main, "claude/**"]
    # Docs-only pushes skip the pipeline. None of these paths is a build or test input (the app's
    # brand assets live in apps/web/public/brand, not in the top-level brand/). Pull requests are
    # not filtered, so a required check can never be left pending.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "brand/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same branch or pull request cancels the older run; main is never cancelled
  # (every main commit must finish, it deploys).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GitHub Pages serves a project site at /<repository name>/: the build and every E2E server use
# the same base, so renaming the repository (ADR-032) needs no workflow change.
env:
  WREN_BASE: /${{ github.event.repository.name }}/

jobs:
  # Main only fast-forwards to commits that already passed this workflow on a claude/** branch
  # (ADR-083 amendment). On a push to main this asks the API for a successful push run of this same
  # workflow at the exact github.sha, on a claude/** branch of THIS repository (fork and pull
  # request runs never count). verified=true skips the gating jobs; deploys still run after
  # kernel (cache hit) and build. Any API trouble, a direct push, or a failed/cancelled dev run
  # gives verified=false and the full pipeline runs. Every other event is always false. The job
  # runs on every event so the jobs that read its output are never skipped by a skipped dependency.
  verified:
    name: Verified on dev branch?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Look for a passing dev-branch run of this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          verified=false
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            workflow_id="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .workflow_id || true)"
            if [ -n "$workflow_id" ]; then
              url="$(gh api "repos/${REPO}/actions/workflows/${workflow_id}/runs?head_sha=${SHA}&event=push&status=completed&per_page=100" \
                --jq "[.workflow_runs[] | select(.head_sha == \"${SHA}\" and .event == \"push\" and .conclusion == \"success\" and (.head_branch | startswith(\"claude/\")) and .head_repository.full_name == \"${REPO}\" and .id != ${RUN_ID})] | first | .html_url // empty" || true)"
              if [ -n "$url" ]; then
                verified=true
                echo "Verified by ${url}"
                echo "### Verified: skipping the gating jobs" >> "$GITHUB_STEP_SUMMARY"
                echo "Commit \`${SHA}\` already passed this workflow: ${url}" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            if [ "$verified" = false ]; then
              echo "### Not verified: running the full pipeline" >> "$GITHUB_STEP_SUMMARY"
              echo "No successful dev-branch run of \`${SHA}\` was found." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "verified=${verified}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (Biome)
    needs: verified
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      # File-size guardrail (PLAN H1): warn > 1,500 lines, fail > 2,500 except the shrinking
      # allow-list in scripts/file-size-allowlist.json.
      - name: File-size guardrail
        run: pnpm check:size
      # The allow-list ratchet: on a pull request, no new entry and no raised ceiling vs the base.
      - name: File-size allow-list only shrinks
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-file-sizes.mjs --base "origin/${{ github.base_ref }}"

  kernel:
    name: Kernel
    uses: ./.github/workflows/kernel.yml

  test:
    name: Typecheck and unit tests
    needs: [kernel, verified]
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build and size budget
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - name: Build (base /<repository name>/)
        run: pnpm build
        env:
          # Public OAuth client ids and URLs for cloud/git sync (docs/SYNC_SETUP.md). Repository
          # *variables* (Settings > Secrets and variables > Actions > Variables), never secrets:
          # they are baked into the public bundle. Unset variables expand to empty strings, which
          # the app reads as "provider not configured": the build stays green.
          VITE_SYNC_WORKER_URL: ${{ vars.VITE_SYNC_WORKER_URL }}
          VITE_GIT_CORS_PROXY: ${{ vars.VITE_GIT_CORS_PROXY }}
          VITE_DROPBOX_APP_KEY: ${{ vars.VITE_DROPBOX_APP_KEY }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_GDRIVE_CLIENT_ID: ${{ vars.VITE_GDRIVE_CLIENT_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_GITLAB_CLIENT_ID: ${{ vars.VITE_GITLAB_CLIENT_ID }}
          VITE_BITBUCKET_CLIENT_ID: ${{ vars.VITE_BITBUCKET_CLIENT_ID }}
      - name: Initial-route JS budget (<= 250 kB gzip)
        run: pnpm --filter @wren-cad/web size
      # Every JS chunk, raw and gzip, initial vs lazy, with the initial-route headroom (PLAN H1).
      # Written to the job summary and uploaded; a new editor in the initial list stopped lazy-loading.
      - name: Bundle report (per chunk)
        run: pnpm --filter @wren-cad/web bundle-report --md bundle-report.md --json bundle-report.json
      - name: Upload bundle report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-report
          path: |
            apps/web/bundle-report.md
            apps/web/bundle-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # Smoke tier (ADR-083): ~13 tests tagged @smoke in the e2e specs (boot and box, sketch -> extrude
  # -> reload -> export, dimension edit, fillet, push/pull, undo/redo, configurations, parameter
  # autocomplete, radial menu, touch bubble, isolation, installed-PWA chrome). Chromium and
  # chromium-touch, one worker, about 3 minutes of tests after the build: a broken build or boot
  # fails here, in minutes, before the expensive chromium and reference shards start (they need: smoke; perf and package-e2e run alongside it).
  smoke:
    name: Smoke (chromium, @smoke)
    needs: [build, verified]
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      - name: Run smoke tests
        run: pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --grep @smoke --project=chromium --project=chromium-touch
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-smoke
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (chromium, shard ${{ matrix.shard }}/8)
    needs: [build, smoke, verified]
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    # Sharded: the chromium suite outgrew one 30-minute runner with M3.6 (job cancelled at 30:00).
    # 155 tests (chromium + chromium-touch), 19-20 per shard. H1 measured ~57 min of serial time for
    # 114 tests, so about 75-80 min now: eight shards of ~10 min plus ~3 min of setup. The limit
    # fails a shard that drifts well past that. Firefox and WebKit run in soak.yml (ADR-083).
    timeout-minutes: 25
    strategy:
      # One failing shard cancels the rest: the run is red either way and the runners free up for
      # the next push. Playwright retries once on CI (playwright.config.ts), which absorbs a flake.
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      - name: Run Playwright
        # One worker (playwright.config.ts) and traces kept only for failures: a slow-runner flake
        # leaves a trace in the playwright-report artefact instead of a bare timeout. Chromium also
        # runs the installed-PWA chrome checks with touch emulation (chromium-touch).
        run: pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=chromium --project=chromium-touch --shard=${{ matrix.shard }}/8
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The M3 reference parts (PLAN §12A) take ~20 min serially (10 tests): three gating shards of
  # 3-4 tests, ~7 min each. Not the long pole (the e2e shards, perf and the viewport suite are), so
  # no more shards.
  e2e-reference:
    name: E2E reference parts (chromium, shard ${{ matrix.shard }}/3)
    needs: [build, smoke, verified]
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=chromium-reference --shard=${{ matrix.shard }}/3
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-reference-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  package-e2e:
    # Split (viewport | ui): together they reached ~30 min after H1 added wheel and section specs.
    # The viewport suite runs one worker (WebGL timing probes) and became the CI long pole at
    # ~21 min (run #59), so it is sharded three ways; ui stays one job (~10 min).
    name: E2E (${{ matrix.suite }}${{ matrix.shard && format(' {0}/3', matrix.shard) || '' }}, chromium)
    needs: [lint, verified]
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: viewport, shard: 1 }
          - { suite: viewport, shard: 2 }
          - { suite: viewport, shard: 3 }
          - { suite: ui }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install chromium
        run: pnpm --filter @wren-cad/viewport exec playwright install --with-deps chromium
      - name: Viewport E2E
        if: matrix.suite == 'viewport'
        run: pnpm --filter @wren-cad/viewport e2e --shard=${{ matrix.shard }}/3
      # Visual baselines were recorded outside CI; until CI-generated baselines are committed,
      # run the UI suite's functional/a11y assertions and skip pixel comparison.
      - name: UI E2E (functional + axe)
        if: matrix.suite == 'ui'
        run: pnpm --filter @wren-cad/ui exec playwright test --trace off --ignore-snapshots

  # Performance budgets (PLAN §10) enforced as a test, with the SwiftShader factor from
  # apps/web/e2e/perf/budgets.ts (ADR-009). Gates the deploy.
  perf:
    name: Performance budgets
    needs: [build, verified]
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Read by the viewport probes (1M-triangle orbit) and nothing else; they are skipped without it.
      WREN_PERF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      # Shell time-to-interactive (cold, fast 4G) and peak memory after the demo bracket + edits.
      # Same as `pnpm perf` minus the rebuild: the build job's artefact is what ships.
      - name: Web perf (shell TTI, memory)
        run: pnpm --filter @wren-cad/web perf:run --trace off
      # Viewport frame-time probes (WREN_PERF=1 above), gating. WREN_PERF_ASSERT=1 turns on their
      # assertions; every time budget is multiplied by the CI factor (3, packages/viewport/e2e/
      # perf-budget.ts, same rule as apps/web/e2e/perf/budgets.ts, ADR-010). The harness is served
      # from its production build (WREN_VIEWPORT_PREVIEW): against the dev server, a late
      # dependency optimisation reloads the page mid-probe ("Execution context was destroyed").
      # compare.spec's toggle probe measures render CPU of a frame (~20 ms on software GL against the
      # 16 ms real-hardware budget); the factor covers it, it is not informational any more.
      - name: Viewport perf (1M triangles, compare, preview latency)
        env:
          WREN_PERF_ASSERT: "1"
          WREN_VIEWPORT_PREVIEW: "1"
        run: pnpm --filter @wren-cad/viewport perf
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            apps/web/test-results
            packages/viewport/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Lighthouse (performance, accessibility, best practices, SEO) against the production build.
  # Lighthouse 12+ dropped its PWA category; installability is asserted by the pwa-shell and
  # platform E2E specs. Non-gating at first: scores are recorded in the job summary and artefact.
  lighthouse:
    name: Lighthouse (non-gating)
    needs: [build, verified]
    if: ${{ needs.verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      - name: Lighthouse CI
        working-directory: apps/web
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.cjs
      - name: Record scores
        if: always()
        working-directory: apps/web
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          if-no-files-found: ignore
          retention-days: 14

  # Deploys only after every gating check passed on a push to main (reviewer M0 defect 6).
  pages:
    name: Deploy to GitHub Pages
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && (needs.verified.outputs.verified == 'true' || (needs.lint.result == 'success' && needs.test.result == 'success' && needs.smoke.result == 'success' && needs.e2e.result == 'success' && needs.e2e-reference.result == 'success' && needs.package-e2e.result == 'success' && needs.perf.result == 'success')) }}
    needs: [verified, lint, test, build, smoke, e2e, e2e-reference, package-e2e, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Publishes the site for Cloudflare Pages (ADR-082). Cloudflare cannot build the OCCT kernel, so
  # it serves the `cloudflare-pages` branch as-is (no build command): this job builds the same
  # commit for the root of wren-cad.app (WREN_BASE=/), reusing the kernel-dist artefact, guards the
  # 25 MiB per-file limit, and force-pushes dist as the branch's single commit. Same gates as
  # `pages`. The only job with contents: write. Pushes made with GITHUB_TOKEN start no workflow.
  cloudflare:
    name: Publish to cloudflare-pages branch
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && (needs.verified.outputs.verified == 'true' || (needs.lint.result == 'success' && needs.test.result == 'success' && needs.smoke.result == 'success' && needs.e2e.result == 'success' && needs.e2e-reference.result == 'success' && needs.package-e2e.result == 'success' && needs.perf.result == 'success')) }}
    needs: [verified, lint, test, build, smoke, e2e, e2e-reference, package-e2e, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # Overrides the workflow-level /<repository name>/ for this job only.
      WREN_BASE: /
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - name: Build (base /)
        run: pnpm build
        env:
          VITE_SYNC_WORKER_URL: ${{ vars.VITE_SYNC_WORKER_URL }}
          VITE_GIT_CORS_PROXY: ${{ vars.VITE_GIT_CORS_PROXY }}
          VITE_DROPBOX_APP_KEY: ${{ vars.VITE_DROPBOX_APP_KEY }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_GDRIVE_CLIENT_ID: ${{ vars.VITE_GDRIVE_CLIENT_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_GITLAB_CLIENT_ID: ${{ vars.VITE_GITLAB_CLIENT_ID }}
          VITE_BITBUCKET_CLIENT_ID: ${{ vars.VITE_BITBUCKET_CLIENT_ID }}
      # Drops 404.html, checks the root-base manifest, fails if any file is over Cloudflare's 25 MiB
      # static-asset limit, then lays the site out for Workers with static assets: public/ plus an
      # assets-only wrangler.jsonc (ADR-082 amendment). The Worker connected to this branch must
      # have this name: set the repository variable CLOUDFLARE_WORKER_NAME, else "wren-cad".
      - name: Prepare, size-guard and bundle the Cloudflare Worker site
        env:
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'wren-cad' }}
        run: >-
          node apps/web/scripts/cloudflare-dist.mjs apps/web/dist --max-mib 25
          --worker-out "$RUNNER_TEMP/cloudflare-site" --worker-name "$WORKER_NAME"
      - name: Force-push the Worker site to cloudflare-pages
        working-directory: ${{ runner.temp }}/cloudflare-site
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git init --quiet --initial-branch=cloudflare-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Deploy ${SOURCE_SHA}" -m "Built from ${REPO_URL%.git}/commit/${SOURCE_SHA}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
            push --force "$REPO_URL" cloudflare-pages
