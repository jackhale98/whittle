name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub Pages serves a project site at /<repository name>/: the build and every E2E server use
# the same base, so renaming the repository (ADR-032) needs no workflow change.
env:
  WREN_BASE: /${{ github.event.repository.name }}/

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .

  kernel:
    name: Kernel
    uses: ./.github/workflows/kernel.yml

  test:
    name: Typecheck and unit tests
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build and size budget
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download kernel artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
      - name: Build (base /<repository name>/)
        run: pnpm build
        env:
          # Public OAuth client ids and URLs for cloud/git sync (docs/SYNC_SETUP.md). Repository
          # *variables* (Settings > Secrets and variables > Actions > Variables), never secrets:
          # they are baked into the public bundle. Unset variables expand to empty strings, which
          # the app reads as "provider not configured": the build stays green.
          VITE_SYNC_WORKER_URL: ${{ vars.VITE_SYNC_WORKER_URL }}
          VITE_GIT_CORS_PROXY: ${{ vars.VITE_GIT_CORS_PROXY }}
          VITE_DROPBOX_APP_KEY: ${{ vars.VITE_DROPBOX_APP_KEY }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_GDRIVE_CLIENT_ID: ${{ vars.VITE_GDRIVE_CLIENT_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_GITLAB_CLIENT_ID: ${{ vars.VITE_GITLAB_CLIENT_ID }}
          VITE_BITBUCKET_CLIENT_ID: ${{ vars.VITE_BITBUCKET_CLIENT_ID }}
      - name: Initial-route JS budget (<= 250 kB gzip)
        run: pnpm --filter @wren-cad/web size
      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: build
    runs-on: ubuntu-latest
    # Sharded: the chromium suite outgrew one 30-minute runner with M3.6 (job cancelled at 30:00).
    timeout-minutes: 40
    # Firefox/WebKit are reported but do not gate deploys yet (ADR-005 §7): headless Firefox on
    # CI has not rendered the box, and Playwright WebKit cannot reload offline with a SW.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 2 }
          - { browser: chromium, shard: 2, shards: 2 }
          - { browser: firefox, shard: 1, shards: 1 }
          - { browser: webkit, shard: 1, shards: 2 }
          - { browser: webkit, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright
        # Firefox runs headed under Xvfb: headless Firefox on GPU-less runners has no GL context at
        # all, while Xvfb + Mesa (llvmpipe) gives it a working software WebGL2 (ADR-005 §7).
        # One worker (playwright.config.ts) and traces kept only for failures: a slow-runner flake
        # leaves a trace in the playwright-report artefact instead of a bare timeout.
        # Chromium also runs the installed-PWA chrome checks with touch emulation (chromium-touch,
        # gating); WebKit runs them on the iPad Pro 11 device (webkit-ipad, non-gating with the job).
        run: |
          case "${{ matrix.browser }}" in
            firefox)
              WREN_HEADED=1 xvfb-run -a pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=firefox --shard=${{ matrix.shard }}/${{ matrix.shards }} ;;
            chromium)
              pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=chromium --project=chromium-touch --shard=${{ matrix.shard }}/${{ matrix.shards }} ;;
            webkit)
              pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=webkit --project=webkit-ipad --shard=${{ matrix.shard }}/${{ matrix.shards }} ;;
          esac
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The M3 reference parts (PLAN §12A) take ~20 min serially: three gating shards of their own,
  # so neither they nor the main chromium job approach the 30-minute limit.
  e2e-reference:
    name: E2E reference parts (chromium, shard ${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm --filter @wren-cad/web exec playwright test --trace retain-on-failure --project=chromium-reference --shard=${{ matrix.shard }}/3
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-reference-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  package-e2e:
    name: E2E (viewport + ui, chromium)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install chromium
        run: pnpm --filter @wren-cad/viewport exec playwright install --with-deps chromium
      - name: Viewport E2E
        run: pnpm --filter @wren-cad/viewport e2e
      # Visual baselines were recorded outside CI; until CI-generated baselines are committed,
      # run the UI suite's functional/a11y assertions and skip pixel comparison.
      - name: UI E2E (functional + axe)
        run: pnpm --filter @wren-cad/ui exec playwright test --trace off --ignore-snapshots

  # Performance budgets (PLAN §10) enforced as a test, with the SwiftShader factor from
  # apps/web/e2e/perf/budgets.ts (ADR-009). Gates the deploy.
  perf:
    name: Performance budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Read by the viewport probes (1M-triangle orbit) and nothing else; they are skipped without it.
      WREN_PERF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      # Shell time-to-interactive (cold, fast 4G) and peak memory after the demo bracket + edits.
      # Same as `pnpm perf` minus the rebuild: the build job's artefact is what ships.
      - name: Web perf (shell TTI, memory)
        run: pnpm --filter @wren-cad/web perf:run --trace off
      # Viewport frame-time probes (WREN_PERF=1 above). Owned by the viewport package. Advisory
      # until the 1M-triangle probes are assertions and stable: at the time of writing both probes
      # die with "Execution context was destroyed" (a navigation mid-probe). Remove
      # continue-on-error to make them gate.
      - name: Viewport perf (1M triangles)
        continue-on-error: true
        run: pnpm --filter @wren-cad/viewport perf
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            apps/web/test-results
            packages/viewport/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Lighthouse (performance, accessibility, best practices, SEO) against the production build.
  # Lighthouse 12+ dropped its PWA category; installability is asserted by the pwa-shell and
  # platform E2E specs. Non-gating at first: scores are recorded in the job summary and artefact.
  lighthouse:
    name: Lighthouse (non-gating)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install chromium
        run: pnpm --filter @wren-cad/web exec playwright install --with-deps chromium
      - name: Lighthouse CI
        working-directory: apps/web
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.cjs
      - name: Record scores
        if: always()
        working-directory: apps/web
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          if-no-files-found: ignore
          retention-days: 14

  # Deploys only after every gating check passed on a push to main (reviewer M0 defect 6).
  pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build, e2e, e2e-reference, package-e2e, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
