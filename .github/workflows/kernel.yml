# Reusable kernel build (PLAN §7.2). Called by ci.yml (which also deploys Pages) so the Wasm kernel is
# built at most once per distinct input hash and never rebuilt when unchanged.
#
# - `pnpm kernel:build` runs the libcascade toolchain in Docker (digest-pinned images, ~12 GB each
#   on disk) and writes packages/kernel/dist/ (whittle-kernel{,-st}.{js,wasm}, generated init/type
#   files, size-report.json).
# - packages/kernel/dist is cached with actions/cache, keyed by the kernel inputs. Build only on a
#   cache miss. Wasm is never committed.
# - `pnpm kernel:test` always runs (cache hit or miss).
# - The result is uploaded as the `kernel-dist` artifact, consumed by the web build / Pages deploy.
name: Kernel

on:
  workflow_call:
    inputs:
      # A verified main push (ADR-083) passes the dev-branch run that already built and tested this
      # exact commit: its `kernel-dist` artefact is reused instead of rebuilding in Docker. Main
      # cannot read caches saved on claude/** branches, so without this every kernel change would
      # rebuild on main (about 45 minutes) before the deploy.
      from_run:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bump to force a rebuild without touching kernel inputs (e.g. toolchain image digest change
  # that is not reflected in libcascade.config.ts).
  KERNEL_CACHE_VERSION: v1

jobs:
  kernel:
    name: Build and test kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore kernel cache
        id: kernel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/kernel/dist
          # Only the kernel's own inputs: its sources, build config/scripts and package.json (which
          # pins @libcascade/toolchain exactly; the toolchain pins the Docker images by digest).
          # The repo-wide lockfile is deliberately excluded so app/UI dependency changes reuse the
          # cached kernel instead of rebuilding it in Docker.
          key: kernel-${{ env.KERNEL_CACHE_VERSION }}-${{ hashFiles('packages/kernel/src/**', 'packages/kernel/scripts/**', 'packages/kernel/libcascade.config.ts', 'packages/kernel/package.json') }}

      # On a cache miss the downloaded dist is saved to this branch's cache by the cache step's post
      # job, so the next main run hits.
      - name: Reuse the verified dev run's kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.from_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}

      - name: Free disk space for the toolchain images
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.from_run == ''
        run: |
          # The two toolchain images are ~12 GB each on disk; a stock runner has ~14 GB free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Build kernel (Docker)
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.from_run == ''
        run: pnpm kernel:build

      # A reused kernel was already tested by the run that built it.
      - name: Test kernel
        if: inputs.from_run == ''
        run: pnpm kernel:test

      - name: Upload kernel artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-dist
          path: packages/kernel/dist
          if-no-files-found: error
          retention-days: 14
