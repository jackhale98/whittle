<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Wren</title>
    <meta
      name="description"
      content="Free, open-source, browser-native parametric CAD. Installs as a PWA and works offline."
    />
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wren" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <style>
      /* Boot splash (brand loader) until React's first render replaces #root's contents. Light/dark
         follow the system here; the app applies the stored theme once its CSS loads. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f3f5f8;
        color: #46536b;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot img {
        width: 96px;
        height: 96px;
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #0c0f16;
          color: #a5b0c5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <picture>
          <source srcset="%BASE_URL%brand/wren-loader-dark.svg" media="(prefers-color-scheme: dark)" />
          <img src="%BASE_URL%brand/wren-loader-light.svg" alt="" width="96" height="96" />
        </picture>
        <span>Loading Wren…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
