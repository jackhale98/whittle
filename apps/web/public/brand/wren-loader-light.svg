@keyframes c3{0%,13.9%{opacity:0;transform:translate(0px,0px) rotate(0deg)}14.5%{opacity:1;transform:translate(0px,0px) rotate(0deg)}23%{opacity:0;transform:translate(12px,10px) rotate(200deg)}23.1%,29.9%{opacity:0;transform:translate(0px,0px) rotate(0deg)}30.5%{opacity:1;transform:translate(0px,0px) rotate(0deg)}39%{opacity:0;transform:translate(12px,10px) rotate(200deg)}39.1%,45.9%{opacity:0;transform:translate(0px,0px) rotate(0deg)}46.5%{opacity:1;transform:translate(0px,0px) rotate(0deg)}55%{opacity:0;transform:translate(12px,10px) rotate(200deg)}55.1%,100%{opacity:0;transform:translate(0px,0px) rotate(0deg)}}
